name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the release for (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Native .deb and .tar.gz built against the system OBS SDK.
  deb-and-tarball:
    # The runner must provide a prepared OBS SDK because libobs and
    # obs-frontend-api are not available on a clean GitHub-hosted runner.
    runs-on: [self-hosted, linux, x64, obs-sdk]
    env:
      OBS_PREFIX: ${{ vars.OBS_PREFIX }}
      # Public-client OAuth Client IDs (not secrets: PKCE + state + loopback
      # provide the protection). Empty values only disable Twitch/YouTube login.
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify toolchain and OBS SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake
          command -v ninja
          test -n "${OBS_PREFIX}"
          test -x "${OBS_PREFIX}/bin/obs"
          OBS_VERSION_OUTPUT="$("${OBS_PREFIX}/bin/obs" --version 2>&1)"
          printf '%s\n' "${OBS_VERSION_OUTPUT}"
          grep -Eq '(^|[^0-9])32[.]2[.]2([^0-9]|$)' <<< "${OBS_VERSION_OUTPUT}"
          test -f "${OBS_PREFIX}/include/obs/obs.h"
          test -d "${OBS_PREFIX}/lib"

      - name: Build, test, stage and package
        shell: bash
        run: bash scripts/ci-linux.sh

      - name: Show artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          cat dist/SHA256SUMS

      - name: Publish .deb and .tar.gz to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # Flatpak bundle for the OBS Studio Flatpak (com.obsproject.Studio).
  # Runs on the same self-hosted runner, which has flatpak + org.flatpak.Builder
  # and the com.obsproject.Studio runtime installed at --user scope.
  flatpak:
    runs-on: [self-hosted, linux, x64, obs-sdk]
    needs: deb-and-tarball
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Flatpak build tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v flatpak
          command -v dbus-run-session
          # Builder and runtime are expected preinstalled at --user scope; make
          # the invocation resilient by installing anything missing. A session
          # D-Bus is required because the runner runs headless (no X11/DISPLAY).
          dbus-run-session -- flatpak install -y --user --noninteractive flathub \
            org.flatpak.Builder org.freedesktop.Sdk//25.08 com.obsproject.Studio || true

      - name: Build Flatpak bundle
        shell: bash
        run: dbus-run-session -- bash scripts/package-flatpak.sh

      - name: Publish .flatpak to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            packaging/flatpak/obs-multistream-rtmp.flatpak
